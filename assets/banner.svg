<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid { fill: url(#grid); }
    .pulse-orb { animation: pulse 6s ease-in-out infinite alternate; }
    .pulse-orb-rev { animation: pulseRev 7s ease-in-out infinite alternate; }
    .float-card { animation: floatSlow 4s ease-in-out infinite alternate; }
    .float-card-lag { animation: floatSlow 5s ease-in-out infinite alternate-reverse; }
    .wave-line {
      stroke-dasharray: 12, 8;
      animation: dash 25s linear infinite;
    }
    .node-pulse {
      animation: nodeGlow 2s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1) translate(0, 0); opacity: 0.7; }
      100% { transform: scale(1.25) translate(40px, -20px); opacity: 1; }
    }
    @keyframes pulseRev {
      0% { transform: scale(1.1) translate(0, 0); opacity: 0.6; }
      100% { transform: scale(0.9) translate(-50px, 30px); opacity: 0.9; }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes nodeGlow {
      0% { r: 4px; opacity: 0.5; }
      100% { r: 7px; opacity: 1; }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs (Behind everything) -->
  <circle cx="200" cy="120" r="280" fill="url(#orb1)" class="pulse-orb" />
  <circle cx="980" cy="300" r="320" fill="url(#orb2)" class="pulse-orb-rev" />

  <!-- Architectural Background Grid -->
  <rect width="1200" height="420" class="bg-grid" />

  <!-- Dynamic Animated Graph / Pricing Curve in background layer -->
  <g opacity="0.35">
    <path class="wave-line" d="M 0 350 Q 300 200 600 300 T 1200 180" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="wave-line" d="M 0 320 Q 350 380 700 220 T 1200 280" fill="none" stroke="#818cf8" stroke-width="1.5" />
    
    <!-- Dynamic Graph Nodes -->
    <circle cx="300" cy="275" fill="#38bdf8" class="node-pulse" />
    <circle cx="600" cy="300" fill="#818cf8" class="node-pulse" />
    <circle cx="950" cy="210" fill="#c084fc" class="node-pulse" />
  </g>

  <!-- Subtle Dynamic Tech Badges/Pills in Corners (Non-obtrusive background layer) -->
  <g class="float-card" opacity="0.75">
    <rect x="920" y="55" width="220" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="945" cy="77" r="7" fill="#10b981" />
    <text x="965" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Dynamic Monetization</text>
  </g>

  <g class="float-card-lag" opacity="0.75">
    <rect x="60" y="335" width="220" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="85" cy="357" r="7" fill="#38bdf8" />
    <text x="105" y="362" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Configure • Price • Quote</text>
  </g>

  <!-- Main Center Forefront Content -->
  <!-- Pill Tag -->
  <g transform="translate(600, 105)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="5" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">ENTERPRISE QUOTE-TO-CASH &amp; CPQ</text>
  </g>

  <!-- Title: Foreground text -->
  <g transform="translate(600, 185)">
    <text x="0" y="0" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1" filter="url(#glow)">Awesome Dynamic Pricing &amp; CPQ</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 235)">
    <text x="0" y="0" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">Curated Architecture of SaaS Platforms, Pricing Engines &amp; Open-Source Quoting Frameworks</text>
  </g>

  <!-- Feature Tags / Capabilities -->
  <g transform="translate(600, 285)">
    <text x="0" y="0" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
      ⚡ AI Price Optimization &nbsp;•&nbsp; 🛡️ Margin Protection &nbsp;•&nbsp; 📦 Usage Metering &nbsp;•&nbsp; 🔄 Real-time Quoting
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="350" y="325" width="500" height="2" rx="1" fill="url(#accentGrad)" opacity="0.8" />
</svg>
